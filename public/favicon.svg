<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    A glass box: an isometric cube whose three faces carry different amounts
    of the same ink, so it reads as transparent rather than solid. Geometry
    and flat fills only, no blurs or gradients, because this renders at 16px
    in a tab and anything softer turns to mush.

    No hue, matching the app. The palette has no brand colour.
  -->
  <style>
    svg { --c: #1c1b19; }
    /* Dark browser chrome swallows ink, so the mark inverts to paper there,
       the same swap the app's accent makes. */
    @media (prefers-color-scheme: dark) {
      svg { --c: #ebebeb; }
    }
  </style>

  <!-- Right face, turned away from the light. -->
  <path d="M27.5 10 27.5 22 16 28.5 16 16.5Z" fill="var(--c)" fill-opacity=".17" />
  <!-- Left face, deepest through the glass. -->
  <path d="M4.5 10 16 16.5 16 28.5 4.5 22Z" fill="var(--c)" fill-opacity=".07" />
  <!-- Top face, catching the most light. -->
  <path d="M16 3.5 27.5 10 16 16.5 4.5 10Z" fill="var(--c)" fill-opacity=".3" />

  <!-- Silhouette and the three internal edges, drawn last so they sit on top. -->
  <path
    d="M16 3.5 27.5 10 27.5 22 16 28.5 4.5 22 4.5 10Z"
    fill="none"
    stroke="var(--c)"
    stroke-width="2.2"
    stroke-linejoin="round"
  />
  <path
    d="M4.5 10 16 16.5 27.5 10M16 16.5 16 28.5"
    fill="none"
    stroke="var(--c)"
    stroke-width="1.3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
