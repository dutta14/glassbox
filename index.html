<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glassbox — ask what you've written</title>
    <meta
      name="description"
      content="A personal archive that answers in your own words. Ask a question and Glassbox quotes the passage you wrote, with the note it came from. No model, no invention, nothing leaves your machine."
    />
  </head>
  <body>
    <script>
      // Runs before first paint so the app does not flash the wrong theme.
      // Mirrors resolveInitialTheme() in src/hooks/useTheme.ts; change both.
      // Lives inside <body> rather than <head> because it sets a class on
      // document.body, which does not exist yet while <head> is parsing.
      (function () {
        try {
          var stored = localStorage.getItem('glassbox.theme.v1');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.body.classList.add('dark');
        } catch (e) {
          // Light is the default, so doing nothing is the correct fallback.
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
